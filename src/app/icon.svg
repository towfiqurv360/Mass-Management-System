<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Dashboard Gradient -->
    <linearGradient id="tsh-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="80%" stop-color="#9333ea" /> <!-- Purple 600 -->
      <stop offset="100%" stop-color="#db2777" /> <!-- Pink 600 -->
    </linearGradient>
    
    <!-- Subtle Shadow for 3D effect -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#tsh-gradient)" filter="url(#shadow)"/>

  <!-- House Outline (Student House) -->
  <path d="M 256 120 L 120 240 H 160 V 360 A 24 24 0 0 0 184 384 H 328 A 24 24 0 0 0 352 360 V 240 H 392 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bold 'T' (Talukder) -->
  <path d="M 206 200 H 306 A 16 16 0 0 1 306 232 H 272 V 304 A 16 16 0 0 1 240 304 V 232 H 206 A 16 16 0 0 1 206 200 Z" 
        fill="#ffffff" />
</svg>
